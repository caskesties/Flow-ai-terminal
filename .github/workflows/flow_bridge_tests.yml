name: Flow Massive bridge unit tests
on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/flow_bridge_tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Run BBO flow classification tests
        run: cd backend && python -m unittest -v test_flow_classifier.py test_server_signals.py test_post_signal_monitor.py test_equity_basket.py

      - name: Run candle formation and staged strategy regressions
        run: cd backend && python -m unittest -v test_candle_flow.py test_push_schedule.py
      - name: Check browser candle panel states
        run: node --check app.js && node scripts/test_candle_panel.js

      - name: Run independent absorption regression tests
        if: always()
        run: cd backend && python -m unittest -v test_absorption_research.py
      - name: Run two-wave research tests
        if: always()
        run: cd backend && python -m unittest -v test_wave_research.py
