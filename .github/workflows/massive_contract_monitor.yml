name: Massive futures contract status (read-only)
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate active listed contracts
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python3 scripts/massive_contract_guard.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: futures-contract-status
          path: reports/contracts/status.json
          retention-days: 7
